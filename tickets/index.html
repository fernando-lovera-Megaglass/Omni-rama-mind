<!doctype html>
<html lang="es-es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tickets | Omni</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../src/app.css" />
    <script>try{var t=localStorage.getItem('omni:theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  </head>
  <body class="app">
    <aside class="sidenav" id="sidenav"></aside>
    <div class="shell">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="list-root"></main>
    </div>
    <div class="scrim" id="scrim"></div>
    <script type="module" src="../src/tickets.js"></script>
  </body>
</html>
