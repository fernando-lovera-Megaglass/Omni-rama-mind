# Supabase CLI configuration for the Edge Functions of Omni CRM (supabase/functions/*).
# `supabase functions deploy` reads the per-function settings below.
project_id = "xysgvxnieigpaxtmxiui"

# Google redirects the browser here after the consent screen: no Supabase JWT travels with that request.
[functions.gmail-oauth-callback]
verify_jwt = false

[functions.gmail-auth-url]
verify_jwt = true

[functions.gmail-send]
verify_jwt = true

[functions.gmail-sync]
verify_jwt = true

# Twilio: los webhooks (voice, inbound SMS, call-status) los llama Twilio sin JWT — se validan
# con la firma X-Twilio-Signature. connect/send/token sí llevan la sesión del usuario.
[functions.twilio-voice]
verify_jwt = false

[functions.twilio-inbound]
verify_jwt = false

[functions.twilio-call-status]
verify_jwt = false

[functions.twilio-recording]
verify_jwt = true

[functions.twilio-call-record]
verify_jwt = true

[functions.twilio-connect]
verify_jwt = true

[functions.twilio-send]
verify_jwt = true

[functions.twilio-token]
verify_jwt = true

[functions.gmail-account]
verify_jwt = true

[functions.twilio-voicemail-drop]
verify_jwt = true

[functions.twilio-voicemail-amd]
verify_jwt = false

[functions.twilio-transcribe]
verify_jwt = true

[functions.twilio-incoming]
verify_jwt = false
